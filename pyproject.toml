[project]
name = "shelfie-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Miguel Cazorla Zamora", email = "miguelzamora210405@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beanie>=2.2.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
cache-dir = ".ruff_cache"

[tool.ruff.lint.isort]
known-first-party = ["app"]
